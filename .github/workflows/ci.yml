# Checks every change to the tooling against the specification, without publishing:
#   build                    the steps of publish-output.yml in IFC4.x-development
#   pr-validation-commands   the commands of pr-validation.yml in IFC4.x-development
# After a push to main it starts that publish workflow, because a change here is
# not seen by the content repository. Keep the steps in line with those two files.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # a new push to a pull request replaces its running build; builds of main run to the end
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # the branches of IFC4.x-development that are built with this repository
        content: [ifc4.3-main]
    env:
      REPO_DIR: ${{ github.workspace }}/ifc43
      REPO_BRANCH: ${{ matrix.content }}
      TRANSLATIONS_SRC_DIR: ${{ github.workspace }}/translations/translations
      TRANSLATIONS_BUILD_DIR: ${{ github.workspace }}/translations-build
      PO_HASH_PATH: ${{ github.workspace }}/translations-build/po_hash_map.json
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the specification
        uses: actions/checkout@v4
        with:
          repository: buildingSMART/IFC4.x-development
          ref: ${{ matrix.content }}
          path: ifc43
          fetch-depth: 0
          persist-credentials: false

      # a branch that still has its own copy of the code is built with this one;
      # such a branch keeps version.json in that folder
      - name: Remove the code folder of the specification
        shell: bash
        run: |
          set -euxo pipefail
          [ -f ifc43/version.json ] || cp ifc43/code/version.json ifc43/version.json
          rm -rf ifc43/code

      - name: Check out this repository where code/ used to be
        uses: actions/checkout@v4
        with:
          path: ifc43/code
          persist-credentials: false

      - name: Check out sample models
        uses: actions/checkout@v4
        with:
          repository: buildingSMART/IFC4.3.x-sample-models
          path: examples
          fetch-depth: 1
          persist-credentials: false

      - name: Check out translations
        uses: actions/checkout@v4
        with:
          repository: buildingSMART/IFC4.3.x-output
          ref: translations
          path: translations
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ifc43/code/requirements.txt

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y graphviz rsync unzip curl

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install "Cython<3" wheel setuptools
          python -m pip install --no-build-isolation "PyYAML==6.0"
          python -m pip install -r ifc43/code/requirements.txt
          python -m pip install typing_extensions lark

          # the same ifcopenshell build as publish-output.yml
          curl --silent --show-error --retry 5 -o /tmp/ifcopenshell_python.zip https://s3.amazonaws.com/ifcopenshell-builds/ifcopenshell-python-`python3 -c 'import sys;print("".join(map(str, sys.version_info[0:2])))'`-v0.8.6-f8da61b-linux64.zip
          mkdir -p `python3 -c 'import site; print(site.getusersitepackages())'`
          unzip -d `python3 -c 'import site; print(site.getusersitepackages())'` /tmp/ifcopenshell_python.zip
          rm /tmp/ifcopenshell_python.zip

      - name: Unit tests
        working-directory: ifc43
        shell: bash
        run: |
          set -euxo pipefail
          python -m pytest code/tests -q --ignore=code/tests/test_translations.py

      - name: Generate EXPRESS, XSD, property sets, JSON and bSDD
        working-directory: ifc43/code
        shell: bash
        run: |
          set -euxo pipefail
          python -m generators ../schemas/ifc4x3_add2.uml --output ../output

      - name: Fetch earlier IFC releases
        working-directory: ifc43/code
        shell: bash
        run: |
          set -euxo pipefail
          python fetch_reference_schemas.py ..

      - name: Determine EXPRESS parse cache key
        id: parse-cache-key
        shell: bash
        run: |
          set -euo pipefail
          express_dir=$(python -c 'import os, ifcopenshell.express as e; print(os.path.dirname(e.__file__))' | tail -n 1)
          echo "parser=$(cat "$express_dir"/*.py | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "pyparsing=$(python -c 'import pyparsing; print(pyparsing.__version__)')" >> "$GITHUB_OUTPUT"
          echo "python=$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')" >> "$GITHUB_OUTPUT"

      - name: Restore EXPRESS parse caches
        uses: actions/cache@v4
        with:
          path: ifc43/reference_schemas/*.exp.cache.dat
          key: express-parse-${{ hashFiles('ifc43/reference_schemas/*.exp') }}-${{ steps.parse-cache-key.outputs.parser }}-pyparsing${{ steps.parse-cache-key.outputs.pyparsing }}-py${{ steps.parse-cache-key.outputs.python }}

      - name: Mark restored parse caches as newer than the checkout
        shell: bash
        # the parser ignores a cache older than its .exp file
        run: find ifc43/reference_schemas -name '*.exp.cache.dat' -exec touch {} +

      - name: Generate change log data
        working-directory: ifc43/code
        shell: bash
        run: |
          set -euxo pipefail
          python change_log.py ..

      - name: Generate MVD concept data
        working-directory: ifc43/code
        shell: bash
        run: |
          set -euxo pipefail
          python mvd_csv_to_json.py ../schemas

      - name: Generate mvdXML
        working-directory: ifc43/code
        shell: bash
        run: |
          set -euxo pipefail
          python templates_to_mvdxml.py ../output/IFC4.3.mvdxml ..

      - name: Determine MVD scope
        working-directory: ifc43/code
        shell: bash
        run: |
          set -euxo pipefail
          python determine_mvd_scope.py ../output/IFC.exp ../output/IFC4.3.mvdxml

      - name: Build static HTML site
        working-directory: ifc43/code
        shell: bash
        run: |
          set -euxo pipefail
          python -m generators.html --output ../output/html -j 4

  pr-validation-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        content: [ifc4.3-main]
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      SHACLVERSION: "1.5.0"

    steps:
      - name: Check out the specification
        uses: actions/checkout@v4
        with:
          repository: buildingSMART/IFC4.x-development
          ref: ${{ matrix.content }}
          persist-credentials: false

      - name: Remove the code folder of the specification
        shell: bash
        run: |
          set -euxo pipefail
          [ -f version.json ] || cp code/version.json version.json
          rm -rf code

      - name: Check out this repository where code/ used to be
        uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl graphviz rsync unzip

      - name: Install SHACL validator
        shell: bash
        run: |
          set -euxo pipefail
          curl --silent --show-error --location --retry 5 \
            "https://repo1.maven.org/maven2/org/topbraid/shacl/${SHACLVERSION}/shacl-${SHACLVERSION}-bin.zip" \
            --output /tmp/shacl.zip
          sudo unzip -q /tmp/shacl.zip -d /
          sudo chmod +x "/shacl-${SHACLVERSION}/bin/"*
          echo "/shacl-${SHACLVERSION}/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --no-build-isolation "PyYAML==6.0"
          python -m pip install -r code/requirements.txt rdflib
          python -m pip install ifcopenshell

      - name: EXPRESS and XSD
        working-directory: code
        shell: bash
        run: |
          set -euxo pipefail
          python -m generators.express ../schemas/ifc4x3_add2.uml -o /tmp/pr.exp
          [ "$(tail -1 /tmp/pr.exp)" = "END_SCHEMA;" ]
          [ "$(wc -l < /tmp/pr.exp)" -ge 10000 ]
          python -m generators.xsd /tmp/pr.exp /tmp/pr.xsd

      - name: EXPRESS diff
        working-directory: code
        shell: bash
        run: |
          set -euxo pipefail
          python -m express_diff /tmp/pr.exp /tmp/pr.exp /tmp/express_diff.md
          [ -s /tmp/express_diff.md ]

      - name: Property sets, JSON and bSDD
        working-directory: code
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/pset_out /tmp/bsdd_out
          python -m generators.pset ../schemas/ifc4x3_add2.uml -o /tmp/pset_out
          python -m generators.json ../schemas/ifc4x3_add2.uml /tmp/pset_out --output /tmp/structure.json
          python -m generators.bsdd ../schemas/ifc4x3_add2.uml --output /tmp/bsdd_out

      - name: Schema SHACL validation
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          python code/validate_schema_shacl.py
          [ -f output/shacl-result.md ]

  start-publish:
    needs: [build, pr-validation-commands]
    if: ${{ github.event_name == 'push' && github.repository == 'Ghesselink/IFC4.x-tooling' }}
    runs-on: ubuntu-latest
    steps:
      - name: Start the publish workflow in IFC4.x-development
        shell: bash
        env:
          # a token that may start workflows in IFC4.x-development (Actions: read and write)
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No CONTENT_REPO_TOKEN secret. Run 'Publish IFC4.3 Output' in the content repository by hand to publish with this revision."
            exit 0
          fi
          # fork test: the content branches of the prototype
          for ref in preview/tooling-split-3 preview/tooling-split-44; do
            gh workflow run publish-output.yml --repo Ghesselink/IFC4.3.x-development --ref "$ref"
          done
